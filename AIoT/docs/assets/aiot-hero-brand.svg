<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
	<linearGradient id="bg" x1="120" y1="80" x2="1080" y2="680" gradientUnits="userSpaceOnUse">
	  <stop stop-color="#0F1733"/>
	  <stop offset="1" stop-color="#09101F"/>
	</linearGradient>
	<linearGradient id="accent" x1="190" y1="120" x2="980" y2="620" gradientUnits="userSpaceOnUse">
	  <stop stop-color="#76A8FF"/>
	  <stop offset="1" stop-color="#62D0FF"/>
	</linearGradient>
	<linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
	  <stop stop-color="#1A244A"/>
	  <stop offset="1" stop-color="#121935"/>
	</linearGradient>
	<filter id="shadow" x="0" y="0" width="1200" height="760" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
	  <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
	</filter>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="110" r="180" fill="#62D0FF" fill-opacity="0.08"/>
  <circle cx="160" cy="90" r="220" fill="#76A8FF" fill-opacity="0.10"/>

  <g filter="url(#shadow)">
	<rect x="58" y="64" width="1084" height="632" rx="26" fill="url(#panel)" stroke="#FFFFFF" stroke-opacity="0.12"/>
  </g>

  <text x="104" y="130" fill="#62D0FF" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">AIoT</text>
  <text x="178" y="130" fill="#A8B3D1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">面向未来 AI 与 AIoT 的多协议跨平台终端工具</text>

  <rect x="104" y="164" width="488" height="204" rx="22" fill="#0E1530" stroke="#FFFFFF" stroke-opacity="0.09"/>
  <text x="138" y="220" fill="#FFFFFF" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="44" font-weight="800">AI Agent 与现场工程师</text>
  <text x="138" y="272" fill="#FFFFFF" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="44" font-weight="800">共用一套工业连接能力</text>
  <text x="138" y="320" fill="#A8B3D1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24">同一产品，同时支持 TUI 与 CLI，统一协议、连接、监控与自动化调用。</text>

  <rect x="104" y="400" width="220" height="56" rx="14" fill="url(#accent)"/>
  <text x="160" y="436" fill="#081120" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700">官方入口</text>
  <text x="348" y="437" fill="#DCEBFF" font-family="Consolas, monospace" font-size="20">https://tools.123aiot.com</text>

  <rect x="104" y="494" width="140" height="42" rx="21" fill="#152045" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <rect x="258" y="494" width="166" height="42" rx="21" fill="#152045" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <rect x="438" y="494" width="170" height="42" rx="21" fill="#152045" stroke="#FFFFFF" stroke-opacity="0.10"/>
  <text x="143" y="521" fill="#E8EEFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">跨平台</text>
  <text x="299" y="521" fill="#E8EEFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">多协议</text>
  <text x="469" y="521" fill="#E8EEFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">AI Friendly</text>

  <rect x="648" y="164" width="430" height="442" rx="26" fill="#0D1430" stroke="#7AA2FF" stroke-opacity="0.28"/>
  <rect x="680" y="198" width="366" height="52" rx="14" fill="#182246"/>
  <circle cx="710" cy="224" r="7" fill="#62D0FF"/>
  <text x="734" y="231" fill="#E9EEFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">AIoT Terminal</text>

  <rect x="680" y="274" width="156" height="140" rx="18" fill="#121B3D" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="703" y="312" fill="#62D0FF" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">Connect</text>
  <text x="703" y="346" fill="#D7E4FF" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">Protocol</text>
  <text x="703" y="374" fill="#A8B3D1" font-family="Consolas, monospace" font-size="16">opcua / mqtt / s7</text>
  <text x="703" y="402" fill="#D7E4FF" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">Endpoint</text>

  <rect x="858" y="274" width="188" height="140" rx="18" fill="#121B3D" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="882" y="312" fill="#62D0FF" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">Monitored Variables</text>
  <text x="882" y="346" fill="#D7E4FF" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18">A / E / I</text>
  <text x="882" y="374" fill="#A8B3D1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">Add / Edit / Import</text>
  <text x="882" y="402" fill="#A8B3D1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16">Type / Len / Value</text>

  <rect x="680" y="438" width="366" height="136" rx="18" fill="#101734" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <text x="704" y="474" fill="#62D0FF" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="700">CLI / Agent API Surface</text>
  <text x="704" y="510" fill="#DCEBFF" font-family="Consolas, monospace" font-size="18">aiot read opc.tcp://localhost:4840 "ns=2;s=Counter"</text>
  <text x="704" y="542" fill="#DCEBFF" font-family="Consolas, monospace" font-size="18">aiot monitor ws://127.0.0.1:8080/ws --format ndjson</text>
</svg>
